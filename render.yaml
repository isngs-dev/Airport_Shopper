services:
  - type: web
    name: airport-shopper
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # Destination of all three APPLY buttons (baked in at build time)
      - key: VITE_APPLY_URL
        sync: false
      # Receives the contact form as a JSON POST
      - key: VITE_FORM_ENDPOINT
        sync: false
    routes:
      # single-page app: always serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
