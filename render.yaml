services:
  - type: web
    name: airport-shopper
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      # baked into the site at build time
      - key: VITE_APPLY_URL
        sync: false
      # read by the server at runtime (secrets: keep them in Render, never in git)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_CC
        sync: false
      - key: EMAIL_BRAND
        value: Airport Mystery Shopping
      - key: EMAIL_TEAM
        value: iSN
      - key: SITE_URL
        sync: false
      - key: MEETING_LINK
        sync: false
      # working hours are evaluated in this time zone
      - key: MEETING_TIMEZONE
        value: America/New_York
