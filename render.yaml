services:
  - type: web
    name: airport-shopper
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      # baked into the site at build time
      - key: VITE_APPLY_URL
        sync: false
      # read by the server at runtime (secrets: keep them in Render, never in git)
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_FROM_NAME
        value: iSN
      - key: MEETING_LINK
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
